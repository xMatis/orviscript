[package]
name = "orvi-project"
version = "0.11.0"
description = "Project manifest and source graph support for OrviScript"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.23"
pathdiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls-native-certs = "0.8"
semver = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
