[package]
name = "orvi-lsp"
version = "0.4.0"
description = "Language Server Protocol implementation for OrviScript"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "orvi-lsp"
path = "src/main.rs"

[dependencies]
orvi-project = { path = "../orvi-project" }
orvi-sema = { path = "../orvi-sema" }
orvi-syntax = { path = "../orvi-syntax" }
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp-server = "0.23.0"
