[package]
name = "orvi-cli"
version = "0.3.0"
description = "Command-line interface for OrviScript"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "orviscript"
path = "src/main.rs"

[dependencies]
orvi-runtime = { path = "../orvi-runtime" }
orvi-sema = { path = "../orvi-sema" }
orvi-syntax = { path = "../orvi-syntax" }
serde_json = "1.0"

