[package]
name = "orvi-runtime"
version = "0.5.0"
description = "Interpreter runtime for OrviScript"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orvi-project = { path = "../orvi-project" }
orvi-syntax = { path = "../orvi-syntax" }
serde_json = "1"
rpassword = "7"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

