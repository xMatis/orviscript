[package]
name = "orvi-runtime"
version = "0.10.0"
description = "Interpreter runtime for OrviScript"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
orvi-project = { path = "../orvi-project" }
orvi-sema = { path = "../orvi-sema" }
orvi-syntax = { path = "../orvi-syntax" }
serde_json = "1"
rpassword = "7"
async-recursion = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "pipeline_breakdown"
harness = false

[[bench]]
name = "worker_scaling"
harness = false

